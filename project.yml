name: TongJiCanvas
options:
  bundleIdPrefix: com.mln
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  TongJiCanvas:
    type: application
    platform: iOS
    sources:
      - path: TongJiCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mln.tongji-canvas-ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: TongJiCanvas/Info.plist
      properties:
        CFBundleName: Canvas签到
        CFBundleDisplayName: Canvas签到
        NSCameraUsageDescription: 相机权限用于扫描课堂签到二维码
        NSPhotoLibraryUsageDescription: 访问相册
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: TongJiCanvas/TongJiCanvas.entitlements
      properties:
        com.apple.security.app-sandbox: false
