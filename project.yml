name: TongJiCanvas
options:
  bundleIdPrefix: com.mln
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  TongJiCanvas:
    type: application
    platform: iOS
    sources:
      - path: TongJiCanvas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mln.tongji-canvas-ios
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: TongJiCanvas/Info.plist
      properties:
        CFBundleName: CanvasSessionMux
        CFBundleDisplayName: Session Mux
        NSCameraUsageDescription: Camera is used to capture QR codes for HTTP request multiplexing experiments.
        NSPhotoLibraryUsageDescription: Photo library access for importing QR code images.
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
        # iPhone: portrait only
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # iPad: all four orientations required for multitasking (App Store rule)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: TongJiCanvas/TongJiCanvas.entitlements
      properties:
        com.apple.security.app-sandbox: false

  TongJiCanvasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TongJiCanvasTests
    dependencies:
      - target: TongJiCanvas
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.mln.tongji-canvas-ios-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TongJiCanvas.app/TongJiCanvas"
          BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  TongJiCanvas:
    build:
      targets:
        TongJiCanvas: all
        TongJiCanvasTests:
          testing: true
          running: false
          profiling: false
          analyzing: false
          archiving: false
    run:
      config: Release
    test:
      config: Debug
      targets: [TongJiCanvasTests]
