name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Run unit tests
        # Ad-hoc signing (CODE_SIGN_IDENTITY="-") is required so the Security
        # framework can bind Keychain items to a code identity at runtime.
        # CODE_SIGNING_ALLOWED=NO strips all signatures and causes SecItemAdd
        # to fail silently for kSecAttrAccessibleWhenUnlockedThisDeviceOnly items.
        #
        # The destination is resolved dynamically from the CoreSimulator device
        # database so CI stays green as runner images update their simulator
        # catalogue (avoids hardcoded "iPhone 16" breaking on image rotation).
        run: |
          set -o pipefail
          # Resolve the UDID of the first available iPhone iOS simulator.
          # xcrun simctl reads the CoreSimulator DB directly; passing id=<UDID>
          # to xcodebuild bypasses its fragile name/OS-version matching.
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
import json, sys
data = json.load(sys.stdin)
# Iterate runtimes in descending order (prefer latest iOS version)
for rt in sorted(data['devices'].keys(), reverse=True):
    if 'iOS' not in rt:
        continue
    for dev in data['devices'][rt]:
        if 'iPhone' in dev.get('name', '') and dev.get('isAvailable', False):
            print(dev['udid'])
            sys.exit(0)
" 2>/dev/null)
          if [ -n "$SIM_ID" ]; then
            DEST="id=$SIM_ID"
          else
            echo "Warning: no concrete iPhone simulator found via simctl; falling back to name"
            xcrun simctl list runtimes
            xcrun simctl list devices available | head -30
            DEST="platform=iOS Simulator,name=iPhone 16"
          fi
          echo "Resolved destination: $DEST"
          xcodebuild test \
            -project TongJiCanvas.xcodeproj \
            -scheme TongJiCanvas \
            -destination "$DEST" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
          | xcpretty
